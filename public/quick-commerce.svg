ight="700" fill="#ede9fe">10 MIN DELIVERY</text></g><g transform="translate(430 190) rotate(2)"><path d="M45 80Q45 20 105 20H285Q345 20 345 80V365Q345 405 305 405H85Q45 405 45 365Z" fill="url(#yellow)"/><path d="M112 22Q112-35 195-35Q278-35 278 22" fill="none" stroke="#fde68a" stroke-width="20" stroke-linecap="round"/><text x="195" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#111827">blinkit</text><text x="195" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#422006">FAST GROCERY</text></g><g transform="translate(730 165) rotate(-3)"><path d="M45 80Q45 20 105 20H285Q345 20 345 80V365Q345 405 305 405H85Q45 405 45 365Z" fill="url(#red)"/><path d="M112 22Q112-35 195-35Q278-35 278 22" fill="none" stroke="#fca5a5" stroke-width="20" stroke-linecap="round"/><circle cx="92" cy="190" r="27" fill="#fff" opacity=".9"/><path d="M80 190h24M92 178v24" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><text x="215" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#fff">instamart</text><text x="195" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fee2e2">QUICK DELIVERY</text></g></g><path d="M80 585H1120" stroke="#f97316" stroke-width="4" opacity=".65"/><text x="600" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="5" fill="#f8fafc">QUICK COMMERCE LOGISTICS</text></svg>
