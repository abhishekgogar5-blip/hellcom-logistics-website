<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HELLCOM Global Reach</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{--ink:#17263a;--ink-soft:#566477;--grey-land:#d8dce1;--grey-line:#fff;--orange:#ff6a00;--orange-dp:#d95700;--badge:#26384c;--frame:#1c2a3a}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;font-family:Inter,sans-serif;color:var(--ink)}
#card{position:relative;width:100%;max-width:1080px;margin:0 auto;aspect-ratio:16/10.4;background:#fff;border:1.5px solid var(--frame);overflow:hidden}
#map-wrap{position:absolute;inset:5% 4% 11%;display:flex;align-items:center;justify-content:center;z-index:1;overflow:hidden}
#map-wrap svg{width:100%;height:100%;display:block;overflow:visible}
#map-wrap svg [cc]{fill:var(--grey-land)!important;stroke:#fff!important;stroke-width:.65px!important;transition:fill .2s ease}
#map-wrap svg [cc].served{fill:var(--orange)!important}
#map-wrap svg [cc]:hover{filter:brightness(.94)}
.stat{position:absolute;z-index:4;font-family:Poppins,sans-serif}.stat .num{font-weight:700;color:var(--orange);line-height:1;font-size:clamp(28px,3.6vw,46px);letter-spacing:-.01em}.stat .lbl{font-family:Inter,sans-serif;font-weight:500;color:var(--ink-soft);font-size:clamp(10.5px,1.15vw,13.5px);line-height:1.3;margin-top:2px}.stat.markets{top:4.2%;left:3%}
.hq{position:absolute;z-index:5;left:65.2%;top:48%;width:42px;height:42px;border-radius:50%;background:var(--orange-dp);border:2px solid #fff;box-shadow:0 5px 14px rgba(23,38,58,.25);display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px Inter,sans-serif}
.hq:after{content:"";position:absolute;top:39px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--badge)}
.wordmark{position:absolute;left:50%;bottom:4.6%;transform:translateX(-50%);z-index:4;text-align:center;white-space:nowrap}.wordmark .name{font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(20px,3vw,34px);color:var(--ink);letter-spacing:-.01em}.wordmark .name b{color:var(--orange)}.wordmark .tag{margin-top:2px;font-family:Inter,sans-serif;font-size:clamp(10px,1.1vw,12.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}.wordmark .rule{width:46px;height:2.5px;background:var(--orange);margin:6px auto 0;border-radius:2px}
#error{display:none;position:absolute;inset:35% 8%;z-index:8;text-align:center;color:var(--ink-soft);font-size:14px}
@media(max-width:720px){#card{aspect-ratio:3/4;border-width:1px}#map-wrap{inset:13% 2% 17%}.stat.markets{top:4%;left:4%}.hq{left:57%;top:50%;transform:scale(.85)}.wordmark{bottom:4%}}
</style>
</head>
<body>
<div id="card">
  <div id="map-wrap" aria-label="HELLCOM global reach map"></div>
  <div class="stat markets"><div class="num">55+</div><div class="lbl">Countries /<br/>Markets</div></div>
  <div class="hq" title="India Headquarters">HQ</div>
  <div class="wordmark"><div class="name"><b>HELLCOM</b> Global Reach</div><div class="rule"></div><div class="tag">Move With Trust</div></div>
  <div id="error">Global reach map is loading…</div>
</div>
<script>
const SERVED=['ca','us','mx','br','gb','fr','de','es','it','ru','tr','ae','in','cn','jp','sg','au','nz','ph','kr','th','my','vn','id','hk','tw','om','kw','bd','lk','za','tz','ug','ao','cr','gr','cz','il','nl','se','be','ch','dk','fi','pt','si','sk','hu','at','cy','no','pl','ro','rs','bg','ie','hr'];
const mapWrap=document.getElementById('map-wrap');
const error=document.getElementById('error');
async function loadMap(){
  try{
    const response=await fetch('https://raw.githubusercontent.com/benhodgson/markedup-svg-worldmap/master/map.svg',{cache:'force-cache'});
    if(!response.ok) throw new Error('Map request failed');
    const svgText=await response.text();
    mapWrap.innerHTML=svgText;
    const svg=mapWrap.querySelector('svg');
    if(!svg) throw new Error('SVG map missing');
    svg.removeAttribute('width');svg.removeAttribute('height');svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.querySelectorAll('[cc]').forEach(el=>{const code=(el.getAttribute('cc')||'').toLowerCase();if(SERVED.includes(code))el.classList.add('served')});
    error.style.display='none';
  }catch(err){
    error.style.display='block';
    console.error('Global reach map failed to load',err);
  }
}
loadMap();
</script>
</body>
</html>
