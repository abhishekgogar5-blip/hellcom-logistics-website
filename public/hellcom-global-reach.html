<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HELLCOM Global Reach</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{--ink:#1c2a3a;--ink-soft:#55606f;--grey-land:#d8dce1;--grey-line:#fff;--orange:#e8792c;--orange-dp:#c65f1c;--badge:#33404f;--badge-line:#fff;--panel-bg:#fff;--frame:#1c2a3a}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:var(--panel-bg);font-family:'Inter',sans-serif;color:var(--ink)}
#card{position:relative;width:100%;max-width:1080px;margin:0 auto;aspect-ratio:16/10.4;background:var(--panel-bg);border:1.5px solid var(--frame);overflow:hidden}
@media(max-width:720px){#card{aspect-ratio:3/4;border-width:1px}}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}.land{fill:var(--grey-land);stroke:var(--grey-line);stroke-width:.7}.land.served{fill:var(--orange)}
.badge circle{fill:var(--badge);stroke:var(--badge-line);stroke-width:1.6}.badge text{fill:#fff;font-family:'Inter',sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle}.badge.hub circle{fill:var(--orange-dp)}
.stat{position:absolute;z-index:4;font-family:'Poppins',sans-serif}.stat .num{font-weight:700;color:var(--orange);line-height:1;font-size:clamp(26px,3.6vw,46px);letter-spacing:-.01em}.stat .lbl{font-family:'Inter',sans-serif;font-weight:500;color:var(--ink-soft);font-size:clamp(10.5px,1.15vw,13.5px);line-height:1.3;margin-top:2px}
.stat.markets{top:4.2%;left:3%}.stat.services{top:4.2%;left:47%;text-align:left}.stat.partners{bottom:15%;left:3%}.stat.channels{top:52%;right:2.6%;text-align:right}
.wordmark{position:absolute;left:50%;bottom:4.6%;transform:translateX(-50%);z-index:4;text-align:center;white-space:nowrap}.wordmark .name{font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(20px,3vw,34px);color:var(--ink);letter-spacing:-.01em}.wordmark .name b{color:var(--orange)}.wordmark .tag{margin-top:2px;font-family:'Inter',sans-serif;font-size:clamp(10px,1.1vw,12.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}.wordmark .rule{width:46px;height:2.5px;background:var(--orange);margin:6px auto 0;border-radius:2px}
#tooltip{position:absolute;pointer-events:none;z-index:20;background:var(--ink);color:#fff;border-radius:6px;padding:7px 11px;font-family:'Inter',sans-serif;font-size:12px;box-shadow:0 6px 18px rgba(28,42,58,.28);opacity:0;transform:translate(-50%,-130%);transition:opacity .12s ease;white-space:nowrap}#tooltip b{color:var(--orange)}
</style>
</head>
<body>
<div id="card">
<svg id="map"></svg>
<div class="stat markets"><div class="num">55+</div><div class="lbl">Countries /<br/>Markets</div></div>
<div class="stat services"><div class="num">7</div><div class="lbl">Core Services</div></div>
<div class="stat partners"><div class="num">750+</div><div class="lbl">Partner Contacts<br/>on file</div></div>
<div class="stat channels"><div class="num">3</div><div class="lbl">Modes<br/>Air · Ocean · Rail</div></div>
<div class="wordmark"><div class="name"><b>HELLCOM</b> Global Reach</div><div class="rule"></div><div class="tag">Move With Trust</div></div>
<div id="tooltip"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>
<script>
const COUNTRIES=[{"id":156,"code":"CN","name":"China","count":106},{"id":840,"code":"US","name":"United States","count":96},{"id":724,"code":"ES","name":"Spain","count":30},{"id":276,"code":"DE","name":"Germany","count":28},{"id":608,"code":"PH","name":"Philippines","count":24},{"id":392,"code":"JP","name":"Japan","count":22},{"id":410,"code":"KR","name":"South Korea","count":22},{"id":702,"code":"SG","name":"Singapore","count":22},{"id":76,"code":"BR","name":"Brazil","count":20},{"id":124,"code":"CA","name":"Canada","count":20},{"id":300,"code":"GR","name":"Greece","count":19},{"id":203,"code":"CZ","name":"Czech Republic","count":17},{"id":376,"code":"IL","name":"Israel","count":17},{"id":792,"code":"TR","name":"Turkey","count":17},{"id":380,"code":"IT","name":"Italy","count":16},{"id":528,"code":"NL","name":"Netherlands","count":15},{"id":752,"code":"SE","name":"Sweden","count":15},{"id":643,"code":"RU","name":"Russia","count":15},{"id":56,"code":"BE","name":"Belgium","count":13},{"id":756,"code":"CH","name":"Switzerland","count":13},{"id":764,"code":"TH","name":"Thailand","count":12},{"id":24,"code":"AO","name":"Angola","count":12},{"id":250,"code":"FR","name":"France","count":11},{"id":344,"code":"HK","name":"Hong Kong","count":11},{"id":484,"code":"MX","name":"Mexico","count":11},{"id":158,"code":"TW","name":"Taiwan","count":11},{"id":512,"code":"OM","name":"Oman","count":11},{"id":36,"code":"AU","name":"Australia","count":10},{"id":458,"code":"MY","name":"Malaysia","count":10},{"id":208,"code":"DK","name":"Denmark","count":9},{"id":826,"code":"GB","name":"United Kingdom","count":9},{"id":704,"code":"VN","name":"Vietnam","count":8},{"id":246,"code":"FI","name":"Finland","count":7},{"id":620,"code":"PT","name":"Portugal","count":7},{"id":784,"code":"AE","name":"UAE","count":6},{"id":705,"code":"SI","name":"Slovenia","count":6},{"id":703,"code":"SK","name":"Slovakia","count":5},{"id":348,"code":"HU","name":"Hungary","count":5},{"id":360,"code":"ID","name":"Indonesia","count":5},{"id":414,"code":"KW","name":"Kuwait","count":5},{"id":40,"code":"AT","name":"Austria","count":4},{"id":196,"code":"CY","name":"Cyprus","count":4},{"id":578,"code":"NO","name":"Norway","count":4},{"id":616,"code":"PL","name":"Poland","count":4},{"id":642,"code":"RO","name":"Romania","count":4},{"id":554,"code":"NZ","name":"New Zealand","count":3},{"id":144,"code":"LK","name":"Sri Lanka","count":3},{"id":688,"code":"RS","name":"Serbia","count":2},{"id":100,"code":"BG","name":"Bulgaria","count":2},{"id":50,"code":"BD","name":"Bangladesh","count":1},{"id":188,"code":"CR","name":"Costa Rica","count":1},{"id":834,"code":"TZ","name":"Tanzania","count":1},{"id":372,"code":"IE","name":"Ireland","count":1},{"id":191,"code":"HR","name":"Croatia","count":1},{"id":800,"code":"UG","name":"Uganda","count":1}];
const byId=new Map(COUNTRIES.map(d=>[d.id,d]));const svg=d3.select('#map');const tooltip=d3.select('#tooltip');const card=document.getElementById('card');const projection=d3.geoNaturalEarth1();const path=d3.geoPath(projection);const landGroup=svg.append('g').attr('class','land-group');const badgeGroup=svg.append('g').attr('class','badge-group');let world,land;
function resize(){const w=card.clientWidth,h=card.clientHeight;svg.attr('viewBox',`0 0 ${w} ${h}`);if(!land)return;projection.fitSize([w*.94,h*1.06],{type:'Sphere'});const c=projection.translate();projection.translate([c[0],c[1]+h*.02]);landGroup.selectAll('path').attr('d',path);drawBadges(w,h)}
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(w=>{world=w;land=topojson.feature(world,world.objects.countries);landGroup.selectAll('path').data(land.features).join('path').attr('class',d=>'land'+(byId.has(+d.id)?' served':'')).attr('d',path).on('mousemove',(ev,d)=>{const info=byId.get(+d.id);if(!info)return;const rect=card.getBoundingClientRect();tooltip.style('opacity',1).style('left',(ev.clientX-rect.left)+'px').style('top',(ev.clientY-rect.top)+'px').html(`<b>${info.name}</b> — ${info.count} contact${info.count>1?'s':''}`)}).on('mouseleave',()=>tooltip.style('opacity',0));resize()});
function centroidFor(id){if(!land)return null;const f=land.features.find(f=>+f.id===id);if(!f)return null;return path.centroid(f)}
const NUDGE={BE:[-10,-4],NL:[2,-14],DE:[10,2],FR:[-4,14],GB:[-14,-6],IT:[0,16],ES:[-8,18],SE:[6,-14],PL:[10,-2],TR:[6,10],AE:[8,6],IN:[0,10],SG:[6,10],JP:[6,-4],AU:[0,0],CA:[-10,-6],US:[-6,4],BR:[0,0],CZ:[6,-8],AT:[4,4],CH:[-8,6],DK:[4,-10],NO:[-6,-16],FI:[10,-16],GR:[-4,10],CY:[8,4],IL:[-6,6],KW:[4,-4],OM:[4,10],HK:[6,4],TW:[6,2],KR:[4,-6],MY:[0,10],TH:[-6,4],VN:[8,2],ID:[0,14],PH:[8,-2],LK:[0,10],NZ:[0,6],RU:[10,-10],HU:[6,-2],RO:[8,0],SK:[8,-6],SI:[2,8],BG:[6,4],RS:[0,6],PT:[-6,10],IE:[-8,-6],UG:[0,6],TZ:[4,6],AO:[0,6],BD:[6,6],CR:[0,8],MX:[0,10],HR:[2,6]};
function drawBadges(w,h){badgeGroup.selectAll('*').remove();const r=Math.max(9,Math.min(w,h)*.018);const list=[...COUNTRIES];if(!list.find(d=>d.code==='IN'))list.push({id:356,code:'IN',name:'India (HQ)',count:0,hub:true});list.forEach(d=>{let xy=d.code==='IN'?projection([78.9629,22.5937]):centroidFor(d.id);if(!xy)return;const nudge=NUDGE[d.code]||[0,0];const cx=xy[0]+nudge[0],cy=xy[1]+nudge[1];const g=badgeGroup.append('g').attr('class','badge'+(d.code==='IN'?' hub':'')).attr('transform',`translate(${cx},${cy})`);g.append('circle').attr('r',r);g.append('text').attr('font-size',r*.78).text(d.code);if(d.code!=='IN')g.on('mousemove',ev=>{const rect=card.getBoundingClientRect();tooltip.style('opacity',1).style('left',(ev.clientX-rect.left)+'px').style('top',(ev.clientY-rect.top)+'px').html(`<b>${d.name}</b> — ${d.count} contact${d.count>1?'s':''}`)}).on('mouseleave',()=>tooltip.style('opacity',0))})}
window.addEventListener('resize',resize);
</script>
</body>
</html>
